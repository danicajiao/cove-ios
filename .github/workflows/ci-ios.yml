name: CI - iOS

on:
  push:
    branches:
      - main
    paths:
      - 'apps/ios/**'
      - '!apps/ios/**/*.md'
      - '.github/workflows/ci-ios.yml'
  pull_request:
    paths:
      - 'apps/ios/**'
      - '!apps/ios/**/*.md'
      - '.github/workflows/ci-ios.yml'

jobs:
  lint-and-validate:
    name: Lint & Validate
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    defaults:
      run:
        working-directory: apps/ios

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.1'
          bundler-cache: true
          working-directory: apps/ios

      - name: Check for Swift file changes
        id: swift-changes
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '\.swift$' || true)
          if [ -z "$CHANGED" ]; then
            echo "No Swift files changed — skipping lint."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Run SwiftFormat (lint only)
        if: steps.swift-changes.outputs.skip != 'true'
        run: swiftformat --lint .

      - name: Run SwiftLint
        if: steps.swift-changes.outputs.skip != 'true'
        run: swiftlint lint --strict

      - name: Check for merge conflict markers
        if: steps.swift-changes.outputs.skip != 'true'
        run: |
          if grep -r "^<<<<<<< \|^=======$\|^>>>>>>> " Cove/ --include="*.swift"; then
            echo "❌ Merge conflict markers found!"
            exit 1
          fi
          echo "✓ No merge conflict markers"

      - name: Validate Info.plist
        run: |
          plutil -lint "Cove/Supporting Files/Info.plist"
          echo "✓ Info.plist is valid"

  build-and-test:
    name: Build and Test
    if: github.event_name == 'push'
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    defaults:
      run:
        working-directory: apps/ios

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.1'
          bundler-cache: true
          working-directory: apps/ios

      - name: Build iOS app
        run: bundle exec fastlane build

      - name: Run tests
        run: bundle exec fastlane test
        continue-on-error: true
