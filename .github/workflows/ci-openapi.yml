name: CI - OpenAPI Lint

on:
  pull_request:
    paths:
      - 'services/cove-api/api/**'
      - 'services/cove-image/api/**'
      - 'services/cove-item/api/**'
      - 'services/cove-user/api/**'
      - '.github/workflows/ci-openapi.yml'

jobs:
  lint:
    name: Lint OpenAPI spec
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Redocly CLI
        run: npm install -g @redocly/cli@latest

      - name: Lint cove-api openapi.yaml
        run: redocly lint --config services/cove-api/redocly.yaml services/cove-api/api/openapi.yaml

      - name: Lint cove-image openapi.yaml
        run: redocly lint --config services/cove-image/redocly.yaml services/cove-image/api/openapi.yaml

      - name: Lint cove-item openapi.yaml
        run: redocly lint --config services/cove-item/redocly.yaml services/cove-item/api/openapi.yaml

      - name: Lint cove-user openapi.yaml
        run: redocly lint --config services/cove-user/redocly.yaml services/cove-user/api/openapi.yaml
