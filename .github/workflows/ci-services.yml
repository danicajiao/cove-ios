name: CI - Services (Go)

on:
  push:
    branches:
      - main
    paths:
      - 'services/cove-api/**'
      - 'services/cove-image/**'
      - '.github/workflows/ci-services.yml'
  pull_request:
    paths:
      - 'services/cove-api/**'
      - 'services/cove-image/**'
      - '.github/workflows/ci-services.yml'
  # Allows manually triggering a build+push from any branch.
  # Useful for bootstrapping GAR before the integration branch merges to main,
  # or for emergency re-deploys.
  workflow_dispatch:

jobs:
  # ── cove-api ──────────────────────────────────────────────────────────────
  cove-api:
    name: cove-api
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # Required for Workload Identity Federation

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/cove-api/go.mod
          cache-dependency-path: services/cove-api/go.sum

      - name: Run tests
        working-directory: services/cove-api
        run: go test ./...

      - name: Run vet
        working-directory: services/cove-api
        run: go vet ./...

      # Authenticate to GCP using Workload Identity Federation.
      # Runs on pushes to main and on manual workflow_dispatch triggers.
      # Does not run on PRs — PRs only build the image to verify it compiles.
      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push image (main / manual)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: services/cove-api
          push: true
          tags: us-central1-docker.pkg.dev/cove-6a685/services/cove-api:sha-${{ github.sha }}
          build-args: COMMIT_SHA=${{ github.sha }}

      # On PRs: build only (no push) to verify the Dockerfile and that the
      # service still compiles. The image is not tagged or stored.
      - name: Build image (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: services/cove-api
          push: false
          build-args: COMMIT_SHA=${{ github.sha }}

  # ── cove-image ────────────────────────────────────────────────────────────
  cove-image:
    name: cove-image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # Required for Workload Identity Federation

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/cove-image/go.mod
          cache-dependency-path: services/cove-image/go.sum

      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev

      - name: Run tests
        working-directory: services/cove-image
        run: go test ./...

      - name: Run vet
        working-directory: services/cove-image
        run: go vet ./...

      # Authenticate to GCP using Workload Identity Federation.
      # Runs on pushes to main and on manual workflow_dispatch triggers.
      # Does not run on PRs — PRs only build the image to verify it compiles.
      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push image (main / manual)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: services/cove-image
          push: true
          tags: us-central1-docker.pkg.dev/cove-6a685/services/cove-image:sha-${{ github.sha }}
          build-args: COMMIT_SHA=${{ github.sha }}

      # On PRs: build only (no push) to verify the Dockerfile and that the
      # service still compiles. The image is not tagged or stored.
      - name: Build image (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: services/cove-image
          push: false
          build-args: COMMIT_SHA=${{ github.sha }}

  # ── bump-staging-tags ─────────────────────────────────────────────────────
  bump-staging-tags:
    name: Open homelab PR — bump staging tags
    runs-on: ubuntu-latest
    needs: [cove-api, cove-image]
    # Only runs after a successful image push — same gate as the push steps above.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'

    permissions:
      contents: read

    steps:
      - name: Checkout homelab
        uses: actions/checkout@v6
        with:
          repository: danicajiao/homelab
          token: ${{ secrets.HOMELAB_PAT }}

      - name: Bump staging image tags
        run: |
          NEW_TAG="sha-${{ github.sha }}"
          sed -i "s|newTag: sha-[0-9a-f]*|newTag: ${NEW_TAG}|g" \
            apps/cove/overlays/staging/kustomization.yaml

      - name: Open PR in homelab
        env:
          GH_TOKEN: ${{ secrets.HOMELAB_PAT }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          SHORT_SHA="${COMMIT_SHA:0:8}"
          NEW_TAG="sha-${COMMIT_SHA}"
          BRANCH="deploy/cove-staging-sha-${SHORT_SHA}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add apps/cove/overlays/staging/kustomization.yaml
          git commit -m "chore: bump cove services to sha-${SHORT_SHA}"
          git push origin "${BRANCH}"

          cat > /tmp/pr-body.md << EOF
          ## Staging Deploy

          Bumps all cove services in \`apps/cove/overlays/staging\` to \`${NEW_TAG}\`.

          | Service | New tag |
          |---|---|
          | \`cove-api\` | \`${NEW_TAG}\` |
          | \`cove-image\` | \`${NEW_TAG}\` |

          **Source:** [danicajiao/cove@${SHORT_SHA}](https://github.com/danicajiao/cove/commit/${COMMIT_SHA})
          **CI run:** https://github.com/danicajiao/cove/actions/runs/${RUN_ID}

          ## Checklist
          - [ ] CI green on source commit
          - [ ] No unexpected manifest changes in diff
          EOF

          gh pr create \
            --repo danicajiao/homelab \
            --title "Bump cove services to ${NEW_TAG}" \
            --body-file /tmp/pr-body.md \
            --base main \
            --head "${BRANCH}"
