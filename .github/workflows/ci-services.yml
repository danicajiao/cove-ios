name: CI - Services (Go)

on:
  push:
    branches:
      - main
    paths:
      - 'services/cove-api/**'
      - '.github/workflows/ci-services.yml'
  pull_request:
    paths:
      - 'services/cove-api/**'
      - '.github/workflows/ci-services.yml'
  # Allows manually triggering a build+push from any branch.
  # Useful for bootstrapping GAR before the integration branch merges to main,
  # or for emergency re-deploys.
  workflow_dispatch:

jobs:
  # ── cove-api ──────────────────────────────────────────────────────────────
  cove-api:
    name: cove-api
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # Required for Workload Identity Federation

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/cove-api/go.mod
          cache-dependency-path: services/cove-api/go.sum

      - name: Run tests
        working-directory: services/cove-api
        run: go test ./...

      - name: Run vet
        working-directory: services/cove-api
        run: go vet ./...

      # Authenticate to GCP using Workload Identity Federation.
      # Runs on pushes to main and on manual workflow_dispatch triggers.
      # Does not run on PRs — PRs only build the image to verify it compiles.
      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push image (main / manual)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: services/cove-api
          push: true
          tags: us-central1-docker.pkg.dev/cove-6a685/services/cove-api:sha-${{ github.sha }}
          build-args: COMMIT_SHA=${{ github.sha }}

      # On PRs: build only (no push) to verify the Dockerfile and that the
      # service still compiles. The image is not tagged or stored.
      - name: Build image (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: services/cove-api
          push: false
          build-args: COMMIT_SHA=${{ github.sha }}
