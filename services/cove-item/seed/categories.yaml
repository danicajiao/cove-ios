# Cove v1 category taxonomy
#
# Each node has:
#   name: Human-readable display name
#   path: ltree path (dot-separated, lowercase, underscores for spaces)
#   children: (optional) nested subcategories
#
# To add or rename categories: edit this file and re-run the seed script.
# The seed is idempotent — re-running updates names without changing IDs.
#
# Style/attribute refinement (beer ABV, wine varietal, clothing color, etc.)
# is handled via catalog.items.attributes JSONB, not the category tree.
#
